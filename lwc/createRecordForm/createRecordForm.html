<template>
    <lightning-card title="Create New Account">
        <lightning-record-edit-form object-api-name={objectApiName} fields={fields}>
            <lightning-messages></lightning-messages>
            <div class="slds-grid">
                <div class="slds-col slds-size_1-of-2">
                    <lightning-input-field field-name={nameField} value={nameDefaultValue}></lightning-input-field>
                    <lightning-input-field field-name={websiteField}></lightning-input-field>
                </div>
    
            </div>
            <lightning-button type="submit" variant="brand" label="Create Account"></lightning-button>
        </lightning-record-edit-form>
    </lightning-card>
</template>
